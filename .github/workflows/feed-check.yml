name: Check feed sources

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Run feed tests
        continue-on-error: true
        run: gradle :app:testReleaseUnitTest --no-daemon --tests '*RssSourcesTest*'
      - name: Report
        if: always()
        run: |
          MSG=$(grep -ho 'FEED src[^<]*' app/build/test-results/testReleaseUnitTest/*.xml 2>/dev/null | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::notice title=Feed sources::${MSG:-нет вывода}"
