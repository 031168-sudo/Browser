name: Build APK and publish release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Версия релиза, например v0.2.0"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Publish GitHub release with APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.version }}"
          if [ -z "$TAG" ]; then TAG="$GITHUB_REF_NAME"; fi
          if [ "$TAG" = "main" ]; then TAG="build-$(date +%Y%m%d-%H%M)"; fi
          APK=app/build/outputs/apk/debug/app-debug.apk
          cp "$APK" "ReaderLite-$TAG.apk"
          gh release create "$TAG" "ReaderLite-$TAG.apk" --target "$GITHUB_SHA" \
            --title "ReaderLite $TAG" \
            --notes "Сборка APK. Скачай файл и установи на Android." \
            || gh release upload "$TAG" "ReaderLite-$TAG.apk" --clobber
