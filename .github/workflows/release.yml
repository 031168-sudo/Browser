name: Build APK and publish release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Версия релиза, например v0.2.0"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      # Проверка ленты на живых данных. Не блокирует выпуск, только показывает результат.
      - name: Check news feed (live)
        continue-on-error: true
        run: gradle :app:testReleaseUnitTest --no-daemon

      - name: Report feed check
        if: always()
        run: |
          MSG=$(grep -ho 'FEED[^<]*' app/build/test-results/testReleaseUnitTest/*.xml 2>/dev/null | head -30 | sed ':a;N;$!ba;s/\n/%0A/g')
          FAIL=$(grep -ho '<failure message="[^"]*"' app/build/test-results/testReleaseUnitTest/*.xml 2>/dev/null | head -5 | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::notice title=Feed check::${MSG:-нет вывода}"
          if [ -n "$FAIL" ]; then echo "::warning title=Feed check failed::$FAIL"; fi

      - name: Build release APK
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        run: |
          MSG=$(grep -E '^e: |error:|What went wrong' -A2 build.log | head -40 | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Build errors::${MSG:-нет текста ошибки}"

      - name: Publish GitHub release with APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.version }}"
          if [ -z "$TAG" ]; then TAG="$GITHUB_REF_NAME"; fi
          if [ "$TAG" = "main" ]; then TAG="build-$(date +%Y%m%d-%H%M)"; fi
          APK=app/build/outputs/apk/release/app-release.apk
          cp "$APK" "ReaderLite-$TAG.apk"
          gh release create "$TAG" "ReaderLite-$TAG.apk" --target "$GITHUB_SHA" \
            --title "ReaderLite $TAG" \
            --notes "Сборка APK. Скачай файл и установи на Android." \
            || gh release upload "$TAG" "ReaderLite-$TAG.apk" --clobber
