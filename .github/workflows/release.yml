name: Build APK and publish release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Publish GitHub release with APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME:-manual-$(date +%Y%m%d-%H%M)}"
          APK=app/build/outputs/apk/debug/app-debug.apk
          cp "$APK" "ReaderLite-$TAG.apk"
          gh release create "$TAG" "ReaderLite-$TAG.apk" \
            --title "ReaderLite $TAG" \
            --notes "Сборка APK. Скачай файл и установи на Android." \
            || gh release upload "$TAG" "ReaderLite-$TAG.apk" --clobber
